# Despliegue de producción en un VPS (probado contra Contabo + Ubuntu 24.04).
# Variables en el archivo .env de esta misma carpeta (ver .env.prod.example).
# Uso: docker compose -f docker-compose.prod.yml up -d --build

# Sin límite de logs, journald/json-file llena el disco del VPS en semanas.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=web
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    environment:
      TZ: ${BUSINESS_TZ:-America/Guatemala}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Sólo lectura: Traefik únicamente necesita descubrir contenedores.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - web
    labels:
      # Cabeceras de seguridad aplicadas a frontend y backend.
      - traefik.enable=true
      - traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.sec-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      TZ: ${BUSINESS_TZ:-America/Guatemala}
    volumes:
      - ip_db_data:/var/lib/postgresql/data
    # Sin `ports`: la base sólo es visible dentro de la red interna.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 3000
      NODE_ENV: production
      TZ: ${BUSINESS_TZ:-America/Guatemala}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      # Postgres corre en la red interna del compose: TLS no aporta aquí.
      DB_SSL: "false"
      DB_SYNC: ${DB_SYNC:-false}
      # Migraciones al arrancar. Alternativa: dejarlo en false y ejecutar
      # `npm run migration:run:prod` manualmente dentro del contenedor.
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BUSINESS_TZ: ${BUSINESS_TZ:-America/Guatemala}
      AUTO_CLOSE_ENABLED: ${AUTO_CLOSE_ENABLED:-false}
      CORS_ORIGINS: https://${FRONTEND_DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
      - web
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.backend.rule=Host(`${BACKEND_DOMAIN}`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=le
      - traefik.http.routers.backend.middlewares=sec-headers@docker
      - traefik.http.services.backend.loadbalancer.server.port=3000

  frontend:
    build:
      context: ./apps/frontend
      args:
        # Las VITE_* se hornean en el bundle durante el build, no en runtime:
        # cambiarlas exige reconstruir la imagen del frontend.
        VITE_API_URL: https://${BACKEND_DOMAIN}/api/v1
        VITE_SOCKET_URL: https://${BACKEND_DOMAIN}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${BUSINESS_TZ:-America/Guatemala}
    depends_on:
      - backend
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=le
      - traefik.http.routers.frontend.middlewares=sec-headers@docker
      - traefik.http.services.frontend.loadbalancer.server.port=80

networks:
  web:
    name: web
    driver: bridge
  internal:
    driver: bridge

volumes:
  ip_db_data:
  uploads:
  traefik_letsencrypt:
