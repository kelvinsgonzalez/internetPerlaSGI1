x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db-crm:
    image: postgres:16-alpine
    container_name: crm-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      TZ: ${BUSINESS_TZ:-America/Guatemala}
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    networks:
      - internal-crm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-crm:
    build:
      context: ./apps/backend
    container_name: crm-backend
    restart: unless-stopped
    logging: *default-logging
    # Todo el entorno del backend sale de `.env.prod`, que NO se versiona.
    # Ahí viven JWT_SECRET y la identidad del administrador, que el código exige
    # y que nunca deben estar en este archivo ni en ningún otro del repositorio:
    #   JWT_SECRET=          (obligatorio; en producción 32+ caracteres)
    #   ADMIN_EMAIL=         (administrador principal)
    #   LEGACY_ADMIN_EMAIL=  (cuenta anterior: se migra y queda retirada)
    #   RETIRED_EMAILS=      (otras bajas permanentes, separadas por comas)
    # El backend se niega a arrancar si falta JWT_SECRET o es demasiado corto,
    # así que no hace falta duplicar esa comprobación aquí.
    env_file: .env.prod
    # Sólo overrides de infraestructura: lo de `environment` pisa a `env_file`.
    environment:
      DB_HOST: db-crm
      DB_PORT: 5432
      TZ: ${BUSINESS_TZ:-America/Guatemala}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      # Debe coincidir con el punto de montaje de `task_archive` de abajo, por
      # eso se fija aquí y no en `.env.prod`: si divergen, el historial se
      # escribe dentro del contenedor y se pierde al recrearlo.
      TASK_ARCHIVE_DIR: /app/data
    depends_on:
      db-crm:
        condition: service_healthy
    # Sin estos volúmenes, las pruebas subidas en las tareas y el Archivo de
    # Tareas (fichero de texto plano, fuera de la base) viven dentro del
    # contenedor y desaparecen en cada rebuild.
    volumes:
      - uploads:/app/uploads
      - task_archive:/app/data
    networks:
      - internal-crm
      - web
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.crm-backend-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.crm-backend-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.crm-backend-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.crm-backend-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.crm-backend-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.crm-api.rule=Host(`iperla.online`) && PathPrefix(`/crm/api`)"
      - "traefik.http.routers.crm-api.entrypoints=websecure"
      - "traefik.http.routers.crm-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crm-api.middlewares=crm-api-strip,crm-backend-headers"
      - "traefik.http.middlewares.crm-api-strip.stripprefix.prefixes=/crm"
      - "traefik.http.services.crm-api.loadbalancer.server.port=3000"
      - "traefik.http.routers.crm-ws.rule=Host(`iperla.online`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.crm-ws.entrypoints=websecure"
      - "traefik.http.routers.crm-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crm-ws.service=crm-api"

  frontend-crm:
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: https://iperla.online/crm/api/v1
        VITE_SOCKET_URL: https://iperla.online
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
        VITE_BASE_PATH: /crm
    container_name: crm-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend-crm
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.crm-frontend-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.crm-frontend-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.crm-frontend-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.crm-frontend-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.crm-frontend-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.crm-frontend.rule=Host(`iperla.online`) && PathPrefix(`/crm`)"
      - "traefik.http.routers.crm-frontend.entrypoints=websecure"
      - "traefik.http.routers.crm-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crm-frontend.middlewares=crm-frontend-headers"
      - "traefik.http.services.crm-frontend.loadbalancer.server.port=80"

volumes:
  crm_pgdata:
  uploads:
  task_archive:

networks:
  web:
    external: true
  internal-crm:
    internal: true
