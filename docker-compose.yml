services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-internetperla}
    ports:
      # Sólo accesible desde la propia máquina, no desde la red local.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ip_db_data:/var/lib/postgresql/data
  backend:
    build: ./apps/backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-internetperla}
      DB_SSL: ${DB_SSL:-false}
      DB_SYNC: ${DB_SYNC:-true}
      # Sin valor por defecto: un secreto de firma escrito en el repositorio es
      # un secreto quemado. Genéralo con `openssl rand -hex 32` en tu `.env`.
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Identidad del administrador: fuera del código y fuera del repositorio.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      LEGACY_ADMIN_EMAIL: ${LEGACY_ADMIN_EMAIL:-}
      RETIRED_EMAILS: ${RETIRED_EMAILS:-}
      # Archivo de Tareas: fichero de texto plano, fuera de la base de datos.
      TASK_ARCHIVE_DIR: /app/data
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
      - task_archive:/app/data
  frontend:
    build: ./apps/frontend
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
      VITE_SOCKET_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "3001:5173"
    command: npm run preview
    volumes:
      - ./apps/frontend/src:/app/src
volumes:
  ip_db_data:
  uploads:
  task_archive:
